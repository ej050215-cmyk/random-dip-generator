<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Dip Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
  <button id="previewBtn" class="preview-btn" disabled title="Preview dip mockup">
    <svg width="26" height="26" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M16 26 L48 26 L45 54 C44.5 57 42 59 39 59 L25 59 C22 59 19.5 57 19 54 Z" fill="#fdf5fa" stroke="#ffffff" stroke-width="2"/>
      <path d="M17.5 40 L46.5 40 L45 54 C44.5 57 42 59 39 59 L25 59 C22 59 19.5 57 19 54 Z" fill="#e0a83f"/>
      <ellipse cx="32" cy="26" rx="16" ry="4" fill="#ffffff" stroke="#e7d2e7" stroke-width="1.5"/>
    </svg>
  </button>

  <aside id="mockupPanel" class="mockup-panel">
    <h2 class="dipper-label">Dip Preview</h2>
    <svg id="dipMockup" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg" class="mockup-svg" aria-hidden="true">
      <defs>
        <clipPath id="tubClip">
          <path d="M22,58 C22,80 258,80 258,58 L236,158 C236,174 44,174 44,158 Z"/>
        </clipPath>
        <clipPath id="toppingClip">
          <ellipse cx="140" cy="42" rx="118" ry="18"/>
        </clipPath>
        <linearGradient id="glassShine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
          <stop offset="12%" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="88%" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
        </linearGradient>
      </defs>

      <g clip-path="url(#tubClip)">
        <rect id="mockBase" x="10" y="115" width="260" height="90" fill="#E8C97A"/>
        <g id="mockBaseTexture"></g>
        <path id="mockSauce" d="M10,60 L270,60 L270,102 Q220,116 170,100 Q120,85 70,106 Q40,118 10,103 Z" fill="#D6412B"/>
        <g id="mockSauceTexture"></g>
        <rect x="16" y="55" width="248" height="119" fill="url(#glassShine)"/>
      </g>

      <path class="tub-outline" d="M22,58 C22,80 258,80 258,58 L236,158 C236,174 44,174 44,158 Z" fill="none" stroke="#aebcc2" stroke-width="2.5"/>

      <!-- The topping ellipse is drawn full (unclipped by the tub wall): its
           back arc reads as the surface seen from above, its front arc sits
           on top of the sauce band as a thin visible sliver from the side. -->
      <g clip-path="url(#toppingClip)">
        <rect id="mockTopping" x="10" y="10" width="260" height="65" fill="#4C7A3D"/>
        <g id="mockSpeckles"></g>
      </g>
      <ellipse class="tub-rim" cx="140" cy="42" rx="118" ry="18" fill="none" stroke="#aebcc2" stroke-width="3"/>
      <ellipse class="rim-shine" cx="105" cy="34" rx="45" ry="6" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
    </svg>
    <div class="mockup-name" id="mockupName">—</div>
  </aside>

  <main class="card">
    <h1>
      <svg class="dip-icon" width="36" height="36" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M8 28 C8 46 20 56 32 56 C44 56 56 46 56 28 Z" fill="#6b2d6b"/>
        <ellipse cx="32" cy="28" rx="24" ry="8" fill="#8a4a8a"/>
        <ellipse cx="32" cy="27" rx="19" ry="6" fill="#fff2b8"/>
        <path d="M40 10 L54 24 L38 30 Z" fill="#fff8e7" stroke="#0b0f2b" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      Random Dip Generator
    </h1>
    <p class="subtitle">Click the button for a new dip idea</p>

    <div class="result">
      <div class="result-row">
        <span class="label">Base</span>
        <span id="base" class="value">—</span>
      </div>
      <div class="result-row">
        <span class="label">Sauce</span>
        <span id="sauce" class="value">—</span>
      </div>
      <div class="result-row">
        <span class="label">Topping</span>
        <span id="topping" class="value">—</span>
      </div>
    </div>

    <button id="generate">
      <svg class="nacho-icon" width="24" height="24" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fbe8b8"/>
            <stop offset="100%" stop-color="#e0a83f"/>
          </linearGradient>
        </defs>
        <path d="M32 6 L57 54 L7 54 Z" fill="url(#chipGrad)" stroke="#a9702a" stroke-width="1.5" stroke-linejoin="round"/>
        <ellipse cx="37" cy="19" rx="6" ry="3" fill="#ffb703" opacity="0.7" transform="rotate(25 37 19)"/>
        <circle cx="26" cy="24" r="1.4" fill="#a9702a"/>
        <circle cx="36" cy="30" r="1.2" fill="#a9702a"/>
        <circle cx="28" cy="38" r="1.3" fill="#a9702a"/>
        <circle cx="40" cy="40" r="1.1" fill="#a9702a"/>
      </svg>
      Generate Dip
    </button>
  </main>

  <button id="dipperBtn" class="dipper-btn" disabled title="Reveal perfect dipper">
    <svg width="26" height="26" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M32 6 L57 54 L7 54 Z" fill="#f5deb3" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="32" cy="20" r="1.8" fill="#a9702a"/>
      <circle cx="24" cy="32" r="1.6" fill="#a9702a"/>
      <circle cx="40" cy="32" r="1.6" fill="#a9702a"/>
      <circle cx="32" cy="40" r="1.6" fill="#a9702a"/>
    </svg>
  </button>

  <aside id="dipperPanel" class="dipper-panel">
    <h2 class="dipper-label">Perfect Dipper</h2>
    <img class="dipper-icon" id="dipperIcon" src="images/pita.jpg" alt="" />
    <div class="dipper-name" id="dipperName">—</div>
  </aside>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
